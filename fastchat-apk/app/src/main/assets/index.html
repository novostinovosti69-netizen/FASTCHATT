<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<style>

.au{display:flex;gap:10px;align-items:center;min-width:170px}.au button{width:36px;height:36px;border:0;border-radius:50%;background:var(--g);color:#fff;cursor:pointer}

#ep{display:grid;grid-template-columns:repeat(8,1fr);background:var(--card);padding:6px;font-size:24px;text-align:center;max-height:150px;overflow-y:auto}#ep span{cursor:pointer;padding:3px}

@media(max-width:700px){#side{width:100%}#main{position:fixed;inset:0;background:var(--bg);transform:translateX(100%);transition:transform .18s}body.open #main{transform:none}#back{display:block}}
</style></head><body>
<div id="auth"><div class="card"><h1>FastChat</h1><input id="name" placeholder="Name" hidden>

<div id="fwp" class="ov" hidden><div class="card"><h2 style="color:var(--g)">Forward to...</h2><div id="fl" style="max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:4px"></div><button class="link" id="fx">Band karein</button></div></div>
<div id="lb" hidden><img id="lbi"></div>

<div id="addp" class="ov" hidden><div class="card"><h2 style="color:var(--g)">Naya user add karein</h2><input id="an" placeholder="Name"><input id="ae" type="email" placeholder="Email"><input id="ap" placeholder="Password (6+ characters)"><div id="am" style="text-align:center;font-size:14px;min-height:18px"></div><button class="btn" id="ago">Add user</button><button class="link" id="ax">Band karein</button></div></div>
<div id="grp" class="ov" hidden><div class="card"><h2 style="color:var(--g)">Naya group</h2><input id="gn" placeholder="Group name"><div id="gl"></div><div id="gm" style="text-align:center;font-size:14px;min-height:18px"></div><button class="btn" id="gc">Create group</button><button class="link" id="gx">Band karein</button></div></div>
<script type="module">

/* ===== SETTINGS ===== */
const DEFAULT_CFG={apiKey:"",authDomain:"",projectId:"",storageBucket:"",messagingSenderId:"",appId:""}; // ya app ke ⚙ mein paste karein
const ADMIN_EMAIL="mpdsangi@gmail.com";
const USE_STORAGE=false; // true: photo/video/audio Firebase Storage mein (Blaze plan chahiye). false: sab Firestore mein, video band
const ALLOW_SIGNUP=true;
/* ==================== */
const $=id=>document.getElementById(id);
const st={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
let CFG=DEFAULT_CFG;try{const c=JSON.parse(st.get("fc_cfg")||"null");if(c&&c.apiKey)CFG=c}catch(e){}
const ready=!!CFG.apiKey;let app,auth,db,stg;
if(ready){app=initializeApp(CFG);auth=getAuth(app);db=initializeFirestore(app,{experimentalAutoDetectLongPolling:true,ignoreUndefinedProperties:true});if(USE_STORAGE)stg=getStorage(app)}
if(!ALLOW_SIGNUP)$("tog").hidden=true;
const E={"auth/invalid-credential":"Email ya password ghalat hai","auth/invalid-email":"Email ghalat hai","auth/email-already-in-use":"Ye email pehle se registered hai","auth/weak-password":"Password kam az kam 6 characters ka rakhein","auth/network-request-failed":"Internet check karein","auth/too-many-requests":"Bohat koshishein, thori der baad try karein","auth/operation-not-allowed":"Firebase mein Email/Password login enable karein"};
const ermsg=e=>E[e&&e.code]||("Error: "+((e&&e.message)||e));
/* ---- state ---- */
let me=null,meU=null,users={},chats={},cur=null,raw=[],pending=[],unsubs=[],unM=null,known=null,snd=st.get("fc_s")!=="0",replyTo=null,actM=null,tyAt=0;
let hid={};try{hid=JSON.parse(st.get("fc_h")||"{}")}catch(e){}
let thumbs={},imgs={},mel={},lastDay="",pel=[],mp={},signup=false,authBusy=false,hb=null;
const isG=i=>String(i||"").length>0&&!!chats[i]&&chats[i].type==="group";
const dmId=o=>[me,o].sort().join("_"),cidOf=i=>chats[i]&&chats[i].type==="group"?i:dmId(i);
const hm=t=>t?new Date(t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"";
const fmt=s=>{s=Math.round(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const on=t=>t&&Date.now()-t<45000,nmOf=i=>(users[i]&&users[i].name)||"";
const EM=["👍","❤️","😂","😮","😢","🙏"];const hue=i=>{let h=0;for(const c of String(i))h=(h*31+c.charCodeAt(0))%360;return"hsl("+h+",55%,40%)"};
/* ---- sound ---- */
let ac=null;const mkAc=()=>{try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}};
document.addEventListener("pointerdown",()=>{mkAc();if(window.Notification&&Notification.permission==="default"){try{Notification.requestPermission()}catch(e){}}});
function beep(){try{mkAc();const t=ac.currentTime;[880,1175].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),s=t+i*.15;o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.3,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+.2);o.start(s);o.stop(s+.22)})}catch(e){}}
const sndUI=()=>{$("snd").textContent=snd?"🔔":"🔕"};sndUI();$("snd").onclick=()=>{snd=!snd;st.set("fc_s",snd?"1":"0");sndUI();if(snd)beep()};
function notifyChats(s){if(known===null){known={};s.docs.forEach(d=>{const l=d.data().last;known[d.id]=l?l.t:0});return}
let n=null;s.docChanges().forEach(ch=>{const c=ch.doc.data(),l=c.last;if(l&&l.from!==me&&l.t>(known[ch.doc.id]||0))n={c,l};if(l)known[ch.doc.id]=Math.max(known[ch.doc.id]||0,l.t)});
if(n){if(snd)beep();try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}if(document.hidden&&window.Notification&&Notification.permission==="granted"){try{new Notification(n.c.type==="group"?n.c.name:nmOf(n.l.from),{body:n.l.x})}catch(e){}}}}
/* ---- auth ---- */
const needCfg=()=>{if(ready)return false;openCfg("Pehle apni Firebase config paste karein");return true};
$("tog").onclick=()=>{signup=!signup;$("name").hidden=!signup;$("go").textContent=signup?"Sign up":"Login";$("tog").textContent=signup?"Pehle se account hai? Login":"Naya account banayein";$("err").textContent=""};
$("go").onclick=async()=>{if(needCfg())return;$("err").textContent="Please wait...";const e=$("email").value.trim(),p=$("pass").value,n=$("name").value.trim();
try{if(signup){if(!n){$("err").textContent="Naam likhein";return}authBusy=true;const r=await createUserWithEmailAndPassword(auth,e,p);await updateProfile(r.user,{displayName:n});
await setDoc(doc(db,"users",r.user.uid),{name:n,email:e.toLowerCase(),lastSeen:Date.now()});authBusy=false;await begin(r.user)}else await signInWithEmailAndPassword(auth,e,p);$("err").textContent=""}
catch(x){authBusy=false;$("err").textContent=ermsg(x)}};
$("fp").onclick=async()=>{if(needCfg())return;const e=$("email").value.trim();if(!e){$("err").textContent="Pehle email likhein";return}try{await sendPasswordResetEmail(auth,e);$("err").textContent="Password reset ka email bhej diya gaya"}catch(x){$("err").textContent=ermsg(x)}};
$("out").onclick=()=>signOut(auth);
if(ready)onAuthStateChanged(auth,async u=>{if(authBusy)return;if(!u){stop();return}await begin(u)});
async function begin(u){if(me===u.uid&&!$("app").hidden)return;me=u.uid;meU=u;const r=doc(db,"users",me);try{const s=await getDoc(r);if(!s.exists())await setDoc(r,{name:u.displayName||(u.email||"User").split("@")[0],email:(u.email||"").toLowerCase(),lastSeen:Date.now()})}catch(e){}
$("auth").hidden=true;$("app").hidden=false;$("add").hidden=(u.email||"").toLowerCase()!==ADMIN_EMAIL;start()}
function stop(){unsubs.forEach(f=>f());unsubs=[];if(unM)unM();unM=null;clearInterval(hb);me=null;known=null;users={};chats={};cur=null;raw=[];$("app").hidden=true;$("auth").hidden=false;document.body.classList.remove("open")}
function start(){const beat=()=>updateDoc(doc(db,"users",me),{lastSeen:Date.now()}).catch(()=>{});beat();hb=setInterval(()=>{beat();draw()},25000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&me)beat()});
unsubs.push(onSnapshot(collection(db,"users"),s=>{users={};s.docs.forEach(d=>users[d.id]=d.data());draw()}));
unsubs.push(onSnapshot(query(collection(db,"chats"),where("members","array-contains",me)),s=>{chats={};s.docs.forEach(d=>chats[d.id]=d.data());notifyChats(s);draw();markRead()}));
const iv=setInterval(()=>{if(me)head()},2000);unsubs.push(()=>clearInterval(iv))}
$("q").oninput=()=>draw();
/* ---- list + header ---- */
function items(){const L=[];Object.entries(users).forEach(([id,u])=>{if(id===me)return;const c=chats[dmId(id)];L.push({id,type:"u",name:u.name||u.email,seen:u.lastSeen,last:c&&c.last,unread:(c&&c.unread&&c.unread[me])||0})});
Object.entries(chats).forEach(([id,c])=>{if(c.type==="group")L.push({id,type:"g",name:c.name,members:c.members,last:c.last,unread:(c.unread&&c.unread[me])||0})});return L}
let lsig="";
function draw(){if(!me)return;const f=$("q").value.toLowerCase(),L=items().filter(u=>(u.name||"").toLowerCase().includes(f)).sort((a,b)=>((b.last&&b.last.t)||0)-((a.last&&a.last.t)||0)||(a.name||"").localeCompare(b.name||""));
const s1=JSON.stringify(L.map(u=>[u.id,u.name,u.last,on(u.seen),u.unread]))+cur;
if(s1!==lsig){lsig=s1;const l=$("list");l.textContent="";L.forEach(u=>{const d=document.createElement("div");d.className="it";
d.innerHTML='<div class="av"></div><div class="mid"><div class="nm"></div><div class="pv"></div></div><div class="tm"></div>';
const a=d.firstChild;a.textContent=u.type==="g"?"👥":(u.name||"?")[0].toUpperCase();if(u.type==="g")a.style.background="#6c5ce7";if(u.type==="u"&&on(u.seen)){const o=document.createElement("span");o.className="dot";a.append(o)}
d.querySelector(".nm").textContent=u.name;d.querySelector(".pv").textContent=u.last?(u.last.from===me?"You: ":(u.type==="g"?nmOf(u.last.from)+": ":""))+u.last.x:"";
const tm=d.querySelector(".tm");tm.textContent=u.last?hm(u.last.t):"";if(u.unread>0&&cur!==u.id){const b=document.createElement("span");b.className="cnt";b.textContent=u.unread>99?"99+":u.unread;tm.append(document.createElement("br"),b)}
d.onclick=()=>open(u.id);l.append(d)})}
head();drawMsgs()}
function head(){if(!cur)return;const g=isG(cur),c=chats[cidOf(cur)],u=users[cur];$("lv").hidden=!g;$("del").hidden=!(meU&&(meU.email||"").toLowerCase()===ADMIN_EMAIL&&!g);
const ty=Object.entries((c&&c.typing)||{}).filter(([i,t])=>i!==me&&Date.now()-t<5000).map(([i])=>nmOf(i)).filter(Boolean);
if(g){$("hn").textContent=c.name;$("hav").textContent="👥";$("hs").textContent=ty.length?ty.join(", ")+" typing…":(c.members||[]).map(nmOf).join(", ").slice(0,60)}
else if(u){$("hn").textContent=u.name;$("hav").textContent=(u.name||"?")[0].toUpperCase();$("hs").textContent=ty.length?"typing…":(on(u.lastSeen)?"online":(u.lastSeen?"last seen "+hm(u.lastSeen):""))}}
/* ---- messages ---- */
function norm(d){const x=d.data(),c=chats[cidOf(cur)],oth=c?(isG(cur)?(c.members||[]).filter(i=>i!==me):[cur]):[],sn=oth.length&&oth.every(i=>((c.read&&c.read[i])||0)>=(x.t||0))?1:0;return{id:d.id,me:x.from===me?1:0,w:x.from,x:x.x||"",t:x.t||0,k:x.del?"del":(x.k||""),mt:x.mt,du:x.du,th:x.thumb,url:x.url,rx:x.rx||{},rp:x.rp||null,p:d.metadata.hasPendingWrites,s:sn}}
